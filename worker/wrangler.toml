name = "estructuras-chat"
main = "worker.js"
compatibility_date = "2024-11-01"

# Las claves NO van aquí. Se guardan como secretos cifrados:
#   npx wrangler secret put DEEPSEEK_API_KEY     (asistente de IA)
#   npx wrangler secret put RESEND_API_KEY       (envío de formularios)

# El destinatario NO va aquí: este repositorio es público y el correo quedaría
# expuesto a los rastreadores de spam. Se guarda como secreto, igual que las keys:
#   npx wrangler secret put LEAD_TO
# Admite varios separados por coma:  proyectos@caabsasteel.mx,ventas@caabsasteel.mx

[vars]
# Remitente de los avisos del formulario.
# OJO: esto SOLO funciona una vez verificado caabsasteel.mx en resend.com/domains.
# Antes de eso, Resend rechaza el envío con 403 y el visitante ve un error.
# Para volver al modo de pruebas: "CAABSA STEEL <onboarding@resend.dev>"
LEAD_FROM = "Sitio web CAABSA STEEL <web@caabsasteel.mx>"

# Desde dónde toma el correo el logotipo del membrete.
# OJO: desplegar este cambio SOLO cuando el sitio ya esté en caabsasteel.mx;
# antes de eso el logo del correo saldría roto.
SITE_URL = "https://caabsasteel.mx"
